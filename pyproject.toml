[project]
name = "h3-scribe"
version = "1.1.1"
description = "MiniMax H3 prompt authoring for ComfyUI"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7"]

[dependency-groups]
dev = [
    "pytest",
]

[project.urls]
Repository = "https://github.com/last-git/h3_scribe"
"Bug Tracker" = "https://github.com/last-git/h3_scribe/issues"

[tool.comfy]
PublisherId = "last"
DisplayName = "H3 Scribe"

[tool.setuptools.packages.find]
include = ["h3_scribe*"]
namespaces = false